name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Workflow exports are valid JSON
        run: |
          for f in workflows/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - run: npm ci
      - name: Code-node behaviour checks
        run: node tests/check-code-nodes.js
      - name: P3 SQL and index checks (real PostgreSQL engine)
        run: node tests/check-slot-holds.js
